summary{list-style:none;cursor:pointer}summary::-webkit-details-marker{display:none}

@keyframes blink{50%{opacity:.15}}
.pulse{animation:blink 1.4s steps(1) infinite}

@keyframes mqx{to{transform:translateX(-50%)}}
@keyframes mqy{to{transform:translateY(-50%)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes flt{50%{transform:translateY(-10px)}}
@keyframes ping{0%{transform:scale(.3);opacity:.8}100%{transform:scale(1.7);opacity:0}}
@keyframes dashflow{to{stroke-dashoffset:-24}}
@keyframes caret{50%{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes drawln{from{stroke-dashoffset:var(--len,600)}}
@keyframes growx{from{transform:scaleX(0)}}
@keyframes growy{from{transform:scaleY(0)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
@property --n{syntax:'<integer>';initial-value:0;inherits:false}
@keyframes count{from{--n:0}}
.cnt{counter-reset:n var(--n);animation:count 2.4s cubic-bezier(.2,.7,.2,1) both}
.cnt::after{content:counter(n)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
